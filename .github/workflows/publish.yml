name: Render & publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto (with TinyTeX for the PDFs)
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      # Renders the whole site (HTML + one PDF per language) and pushes
      # _site to the gh-pages branch. Missing LaTeX packages (tcolorbox,
      # qrcode, ...) are installed automatically by Quarto via TinyTeX.
      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
